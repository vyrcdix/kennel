<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" role="img" aria-label="Lily running">
  <title>Lily — running</title>
  <!-- Dust puffs -->
  <circle cx="10" cy="115" r="6" fill="#C9A87C" opacity="0.5"/>
  <circle cx="2" cy="108" r="4" fill="#C9A87C" opacity="0.35"/>
  <circle cx="16" cy="122" r="5" fill="#C9A87C" opacity="0.4"/>
  <!-- Motion lines -->
  <line x1="0" y1="72" x2="18" y2="72" stroke="#C9A87C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="2" y1="88" x2="22" y2="88" stroke="#C9A87C" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tail streaming -->
  <path d="M 62 78 Q 42 68 28 72 Q 20 76 18 70" fill="none" stroke="#D9622C" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Back leg extended -->
  <path d="M 78 98 L 60 128 L 52 126 L 68 94 Z" fill="#A84919"/>
  <!-- Back leg tucked -->
  <path d="M 98 94 Q 108 108 102 128 L 110 128 Q 118 110 110 94 Z" fill="#D9622C"/>
  <!-- Body -->
  <path d="M 58 72 Q 52 92 66 104 L 135 104 Q 155 98 158 82 Q 156 68 140 64 L 88 62 Q 66 62 58 72 Z" fill="#D9622C"/>
  <path d="M 66 94 Q 68 104 82 106 L 135 106 Q 148 102 150 94 Q 128 98 102 96 Q 82 95 66 94 Z" fill="#A84919"/>
  <!-- Front leg reaching -->
  <path d="M 140 92 L 162 116 L 170 112 L 146 88 Z" fill="#D9622C"/>
  <!-- Front leg tucked -->
  <path d="M 128 95 Q 136 112 130 128 L 138 128 Q 144 112 136 94 Z" fill="#A84919"/>
  <!-- Paws -->
  <ellipse cx="56" cy="128" rx="5" ry="2.5" fill="#3A3F45"/>
  <ellipse cx="167" cy="114" rx="4" ry="2" fill="#3A3F45" transform="rotate(45 167 114)"/>
  <!-- Neck -->
  <path d="M 140 64 Q 155 54 170 52 L 180 62 Q 165 70 150 70 Z" fill="#D9622C"/>
  <!-- Head forward -->
  <g transform="translate(165 40) rotate(20)">
    <path d="M 0 20 Q -2 4 10 -4 Q 22 -8 36 -4 Q 46 0 50 6 Q 52 10 48 13 Q 52 14 58 15 Q 66 17 72 21 Q 75 23 75 26 Q 75 29 71 30 Q 64 31 56 30 Q 46 28 36 26 L 18 26 Q 8 26 4 24 Q 0 22 0 20 Z" fill="#D9622C"/>
    <path d="M 48 13 Q 52 14 58 15 Q 66 17 72 21 Q 75 23 75 26 Q 75 29 71 30 Q 64 31 56 30 Q 46 28 36 26 Q 32 22 36 14 Q 42 12 48 13 Z" fill="#A84919" opacity="0.35"/>
    <ellipse cx="72" cy="22" rx="3" ry="2.2" fill="#3A3F45"/>
    <path d="M 12 0 Q 0 -8 -8 -4 Q -12 2 -6 10 Q 4 12 12 8 Q 16 4 14 0 Z" fill="#A84919"/>
    <ellipse cx="28" cy="10" rx="2.3" ry="1.7" fill="#3A3F45"/>
    <circle cx="29" cy="9.5" r="0.5" fill="#F2EDE0" opacity="0.7"/>
    <!-- Tongue -->
    <path d="M 62 28 Q 70 32 68 38 Q 64 40 60 36 Z" fill="#A84919"/>
    <circle cx="50" cy="22" r="0.4" fill="#6B2E10" opacity="0.4"/>
    <circle cx="55" cy="24" r="0.4" fill="#6B2E10" opacity="0.4"/>
  </g>
</svg>
